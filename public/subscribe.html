{{define "subscribe"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to The Paper - Tyler Boyd</title>
</head>
<body>
    <div class="container">
        <h1>📰 Subscribe to The Paper</h1>
        <p class="description">
            Get a daily AI-curated digest of the most relevant tech news, delivered straight to your inbox every morning.
        </p>

        <form id="subscribeForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your@email.com"
                    required
                    autocomplete="email"
                />
            </div>

            <button type="submit" id="submitBtn">Subscribe</button>
        </form>

        <div id="message" class="message hidden"></div>

        <div class="back-link">
            <a href="/">← Back to home</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('subscribeForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('email');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            // Disable form during submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Subscribing...';
            emailInput.disabled = true;

            try {
                const response = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Successfully subscribed! Check your inbox for updates.', 'success');
                    form.reset();
                } else {
                    showMessage(data.error || 'Failed to subscribe. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Subscription error:', error);
                showMessage('An error occurred. Please try again later.', 'error');
            } finally {
                // Re-enable form
                submitBtn.disabled = false;
                submitBtn.textContent = 'Subscribe';
                emailInput.disabled = false;
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');

            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 5000);
            }
        }
    </script>
</body>
</html>
<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

    * {
        font-family: "JetBrains Mono", monospace;
        color: #FBFAF8;
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background-color: #000505;
        min-height: 100vh;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        width: 100%;
        background-color: #0a0f0f;
        padding: 40px;
        border-radius: 12px;
        border: 1px solid #1a2020;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    h1 {
        font-size: 32px;
        margin-top: 0;
        margin-bottom: 20px;
        color: #FBFAF8;
    }

    .description {
        font-size: 16px;
        line-height: 1.6;
        color: #a0a8a8;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #FBFAF8;
    }

    input[type="email"] {
        width: 100%;
        padding: 12px 16px;
        font-size: 16px;
        background-color: #151a1a;
        border: 2px solid #2a3030;
        border-radius: 6px;
        color: #FBFAF8;
        transition: border-color 0.3s ease;
    }

    input[type="email"]:focus {
        outline: none;
        border-color: #E05263;
    }

    input[type="email"]::placeholder {
        color: #606868;
    }

    button[type="submit"] {
        width: 100%;
        padding: 14px 24px;
        font-size: 16px;
        font-weight: 600;
        background-color: #E05263;
        color: #FBFAF8;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease;
    }

    button[type="submit"]:hover:not(:disabled) {
        background-color: #c94455;
        transform: translateY(-1px);
    }

    button[type="submit"]:active:not(:disabled) {
        transform: translateY(0);
    }

    button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .message {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.5;
    }

    .message.hidden {
        display: none;
    }

    .message.success {
        background-color: rgba(46, 204, 113, 0.1);
        border: 1px solid #2ecc71;
        color: #2ecc71;
    }

    .message.error {
        background-color: rgba(231, 76, 60, 0.1);
        border: 1px solid #e74c3c;
        color: #e74c3c;
    }

    .back-link {
        margin-top: 30px;
        text-align: center;
    }

    .back-link a {
        color: #a0a8a8;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
    }

    .back-link a:hover {
        color: #E05263;
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .container {
            padding: 30px 20px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
{{end}}
